services:
  db:
    image: postgres:16
    container_name: web_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "543:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: web_fastapi
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      QUEUE: notifications.created

    ports:
      - "9005:8000"

    depends_on:
      redis:
        condition: service_started
      celery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: web_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      -  /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A celery_app.celery worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis


  minio:
    image: minio/minio
    container_name: web_minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"


  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: web_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${app_user}
      RABBITMQ_DEFAULT_PASS: ${app_pass}
    ports: [ "5672:5672", "15672:15672" ]
    volumes: [ rabbitmq_data:/var/lib/rabbitmq ]
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: web_kafka
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: web_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists \
          --topic ${KAFKA_ORDERS_TOPIC:-orders.created} \
          --partitions 3 --replication-factor 1
    restart: "no"

  order-service:
    build: ./services/order-service
    container_name: web_order_service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_ORDERS_TOPIC: ${KAFKA_ORDERS_TOPIC:-orders.created}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app_user:app_pass@db:5432/app_db}
    ports:
      - "9006:8000"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    container_name: web_notification_service
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      QUEUE: notifications.created
    ports: [ "9007:8000" ]
    depends_on:
      rabbitmq:
        condition: service_healthy




volumes:
  pgdata:
  minio_data:
  kafka_data:
  rabbitmq_data: