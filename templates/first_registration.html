<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация — TechStore</title>
    <link rel="stylesheet" href="/static/first_registration.css" />

</head>
<body>

<div class="register-wrapper">
    <div class="register-card">

        <!-- Логотип и заголовок -->
        <div class="brand">
            <i class="fas fa-laptop-code"></i>
            <span>TechStore</span>
        </div>
        <h1 class="page-title">Создайте аккаунт</h1>
        <p class="page-sub">Начните пользоваться всеми возможностями</p>

        <!-- Форма регистрации -->
        <form action="/register" method="POST" class="register-form">

            <div class="form-group">
                <label for="fullName">Имя и фамилия <span class="required">*</span></label>
                <div class="input-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullName" name="fullName"
                           placeholder="Анна Смирнова" required autocomplete="name" />
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <div class="input-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email"
                           placeholder="anna@example.com" required autocomplete="email" />
                </div>
            </div>

            <div class="form-group">
                <label for="password">Пароль <span class="required">*</span></label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password"
                           placeholder="Минимум 6 символов" required autocomplete="new-password" />
                </div>
            </div>

            <div class="form-group">
                <label for="confirm">Подтверждение пароля <span class="required">*</span></label>
                <div class="input-wrap">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="confirm" name="confirmPassword"
                           placeholder="Повторите пароль" required autocomplete="new-password" />
                </div>
            </div>

            <!-- Согласие -->
            <div class="terms">
                <input type="checkbox" id="terms" name="terms" required />
                <label for="terms">
                    Я принимаю <a href="/terms">условия</a> и <a href="/privacy">политику</a>
                    <span style="color:#e53e3e;">*</span>
                </label>
            </div>

            <button type="submit" class="btn-primary">
                <i class="fas fa-user-plus"></i> Зарегистрироваться
            </button>
        </form>

        <!-- Разделитель -->
        <div class="divider"><span>или через соцсети</span></div>

        <!-- Социальные кнопки -->
        <div class="social-row">
            <button class="social-btn google" type="button">
                <i class="fab fa-google"></i> Google
            </button>
            <button class="social-btn facebook" type="button">
                <i class="fab fa-facebook-f"></i> Facebook
            </button>
            <button class="social-btn vk" type="button">
                <i class="fab fa-vk"></i> VK
            </button>
        </div>

        <!-- Ссылка на вход -->
        <div class="login-link">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>

    </div>
</div>

</body>
</html>
