name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order-service-tests:
    name: Order service tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install component test dependencies
        run: |
          python -m pip install -r services/order-service/requirements.txt pytest==8.3.5 httpx==0.28.1
          mkdir -p test-results

      - name: Run component tests
        run: |
          python -m pytest services/order-service/tests/component -v \
            --junitxml=test-results/component.xml

      - name: Start integration test stack
        run: docker compose -f compose.integration.yml up -d --build --wait --wait-timeout 180 order-service

      - name: Run integration tests
        run: |
          docker compose -f compose.integration.yml run --rm --no-deps -T tests 2>&1 \
            | tee test-results/integration.log

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p test-results
          docker compose -f compose.integration.yml logs --no-color --tail=100 \
            > test-results/compose.log 2>&1

      - name: Remove integration test stack
        if: always()
        run: docker compose -f compose.integration.yml down -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: order-service-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7